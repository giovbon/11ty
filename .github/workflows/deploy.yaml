name: Deploy site-11ty to GitHub Pages

# Este workflow pertence ao repositório do site-11ty. O clone local ainda aponta para
# `git@github.com:giovbon/11ty.git`, mas esse nome foi renomeado: a API responde 301 e o nome
# canônico é **giovbon/impacta** (verificado 2026-09-20). O GitHub redireciona o push antigo.
#
# Publicado em: https://giovbon.github.io/impacta/ — confirmado em 2026-09-20 (/impacta/ responde
# 200 já com `<meta name="base-url" content="/impacta/">`; https://giovbon.github.io/11ty/ dá 404).
# Por isso `BASE_URL: /impacta/` na etapa de build: a base tem de bater com o CAMINHO do Pages,
# senão o site publica com todos os links e assets internos apontando errado.
#
# Não usa nenhum secret: a autenticação é feita pelo OIDC do próprio Actions.
#
# Pré-requisito: em Settings → Pages, o Source tem de ser "GitHub Actions".
# Sem isso, o `configure-pages` falha com "Get Pages site failed ... Not Found".

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "content/**"
      - "slides/**"
      - "mindmaps/**"
      - "codes/**"
      - "scripts/**"
      - "test/**"
      - "eleventy.config.js"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Atenção: os testes esperam a base padrão ("/"). Se BASE_URL vazar para
      # esta etapa, `getBaseUrl()`/`withPrefix()` prefixam as URLs e 5 testes
      # de url/asciinema/typst quebram. Por isso o BASE_URL fica só no build.
      - name: Testes (módulos puros)
        run: npm test

      - name: Build (vendor + assets + Eleventy)
        run: npm run build
        env:
          BASE_URL: /impacta/

      - name: Conferir a saída
        run: |
          test -f _site/index.html || { echo "::error::_site/index.html não foi gerado"; exit 1; }
          echo "Páginas geradas: $(find _site -name '*.html' | wc -l)"

      # Se esta etapa falhar com "Get Pages site failed ... Not Found", é porque o
      # repositório ainda não tinha Pages habilitado. O `enablement: true` não
      # resolve aqui: ele exige um PAT, não o GITHUB_TOKEN do próprio Actions.
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
